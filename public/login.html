<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — BookSpace</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&subset=cyrillic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/forms.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body data-page="login">

  <main id="main" class="container">

    <section class="auth"><h1>Вхід</h1><p class="lead">Раді бачити вас знову.</p>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">Електронна пошта</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-err"><p class="field__error" id="email-err" role="alert" hidden></p></div>
        <div class="field"><label for="password">Пароль</label><div class="field__wrap"><input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-err"><button class="field__toggle" type="button" data-toggle="password" aria-label="Показати пароль">Показати</button></div><p class="field__error" id="password-err" role="alert" hidden></p></div>
        <p class="form-error" id="err" role="alert" hidden></p>
        <button class="btn" type="submit">Увійти</button>
      </form>
      <p class="auth__alt">Ще немає акаунта? <a class="link" href="register.html">Зареєструватися</a></p></section>
  </main>

</body>
</html>
