<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сповіщення — BookSpace</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&subset=cyrillic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/notifications.js" defer></script>
</head>
<body data-page="notes" data-auth="required">
  <a class="skip" href="#main">Перейти до вмісту</a>
  <header class="header">
    <div class="container header__in">
      <a class="logo" href="index.html"><img src="images/logo.png" alt="" width="44" height="44"><span>BookSpace</span></a>
      <nav class="nav" aria-label="Головна навігація"><a href="catalog.html">Каталог</a><a href="shelf.html">Моя полиця</a><a href="profile.html">Профіль</a><a href="notifications.html" aria-current="page">Сповіщення</a></nav>
      <form class="search" role="search" action="catalog.html" autocomplete="off">
        <label class="sr" for="q">Пошук книги</label>
        <input id="q" name="q" type="search" placeholder="Знайти книгу або автора" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
        <ul class="suggest" id="suggest" role="listbox" aria-label="Підказки" hidden></ul>
      </form>
      <a id="auth" class="btn btn--sm" href="login.html">Увійти</a>
    </div>
  </header>
  <main id="main" class="container">

    <div class="narrow">
    <header class="page-head"><div><p class="eyebrow">Сповіщення</p><h1>Сповіщення</h1>
      <p class="lead">Будьте в курсі читацької активності.</p></div><button class="link" type="button" id="read-all">Позначити всі як прочитані</button></header>
    <div class="chips"><ul>
      <li><button class="chip is-on" type="button" data-filter="all" aria-pressed="true">Усі</button></li>
      <li><button class="chip" type="button" data-filter="unread" aria-pressed="false">Непрочитані <span class="badge" id="unread-count">0</span></button></li>
    </ul></div>
    <p class="empty" id="n-empty" hidden>Непрочитаних сповіщень немає.</p>
    <ul class="notes" id="notes-list" aria-live="polite"></ul></div>
  </main>
  <footer class="footer"><div class="container">© 2026 BookSpace · Соціальна платформа для книголюбів</div></footer>
  <nav class="tabbar" aria-label="Мобільна навігація"><a href="index.html"><span aria-hidden="true">⌂</span>Головна</a><a href="catalog.html"><span aria-hidden="true">⌕</span>Каталог</a><a href="shelf.html"><span aria-hidden="true">▤</span>Полиця</a><a href="notifications.html" aria-current="page"><span aria-hidden="true">♤</span>Сповіщення</a><a href="profile.html"><span aria-hidden="true">☺</span>Профіль</a></nav>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
